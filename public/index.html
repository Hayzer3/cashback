<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Eco-Awareness 2026</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { border: 1px solid #00ff88; padding: 20px; border-radius: 10px; text-align: center; }
        button { background: #00ff88; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 5px; }
        #status { margin-top: 10px; font-weight: bold; }
        .loading { opacity: 0.6; }
        .error { color: #ff4444; }
        .success { color: #00ff88; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Eco-Awareness 2026</h1>
        <p>Programa de Cashback Progressivo</p>
        <input type="number" id="eventoId" placeholder="ID do Evento">
        <button onclick="disparar()">Processar Cashback</button>
        <p id="status"></p>
    </div>

    <script>
        async function disparar() {
            const id = document.getElementById('eventoId').value;
            if (!id) {
                document.getElementById('status').innerText = 'Por favor, insira o ID do evento.';
                document.getElementById('status').className = 'error';
                return;
            }
            
            const btn = event.target;
            const statusEl = document.getElementById('status');
            btn.disabled = true;
            btn.textContent = 'Processando...';
            statusEl.textContent = 'Processando cashback...';
            statusEl.className = 'loading';
            document.body.classList.add('loading');
            
            try {
                const res = await fetch('/api/processar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ evento_id: id })
                });
                const data = await res.json();
                statusEl.textContent = data.message || data.error || 'Erro desconhecido';
                statusEl.className = data.message ? 'success' : 'error';
            } catch (err) {
                statusEl.textContent = 'Erro de conexão: ' + err.message;
                statusEl.className = 'error';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Processar Cashback';
                document.body.classList.remove('loading');
            }
        }
    </script>
</body>
</html>
